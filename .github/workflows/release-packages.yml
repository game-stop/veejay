name: Distro package release

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish, for example 1.6.0 or v1.6.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distro-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CUDA_SERIES: 13-3

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      deb_matrix: ${{ steps.matrix.outputs.deb }}
      rpm_matrix: ${{ steps.matrix.outputs.rpm }}
      arch_matrix: ${{ steps.matrix.outputs.arch }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Use current release tooling
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git restore --source="$WORKFLOW_SHA" --worktree -- veejay-current/packaging/ci

      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          version="$(veejay-current/packaging/ci/release-version.sh check)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$version" ]]; then
            printf "ERROR: release tag '%s' does not match package version '%s'\n" \
              "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Load release build matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=veejay-current/packaging/ci/release-matrix.json
          jq -e '
            (.include | length == 24) and
            ([.include[] | select(.variant == "standard")] | length == 14) and
            ([.include[] | select(.variant == "nvjpeg")] | length == 10) and
            ([.include[] | "\(.format):\(.suite_target)"] | unique | length == 24) and
            ([.include[] | select(.build_mode == "qemu")] | length == 4) and
            all(.include[] | select(.build_mode == "qemu");
              .platform == "linux/ppc64le" and
              .qemu_cpu == "power8" and
              .runner == "ubuntu-24.04" and
              .variant == "standard" and
              (.release_target == "ppc64le-generic" or
               .release_target == "ppc64le-power8-altivec")
            ) and
            all(.include[];
              (.format == "deb" or .format == "rpm" or .format == "arch") and
              (.runner == "ubuntu-24.04" or .runner == "ubuntu-24.04-arm") and
              ((.variant == "standard" and .suite_target == .release_target) or
               (.variant == "nvjpeg" and .suite_target == (.release_target + "-nvjpeg")))
            )
          ' "$matrix" >/dev/null
          for format in deb rpm arch; do
            value="$(jq -c --arg format "$format" \
              '{include: [.include[] | select(.format == $format)]}' "$matrix")"
            printf '%s=%s\n' "$format" "$value" >> "$GITHUB_OUTPUT"
          done

  deb:
    name: DEB / ${{ matrix.suite_target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.deb_matrix) }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Use current release tooling
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git restore --source="$WORKFLOW_SHA" --worktree -- veejay-current/packaging/ci

      - name: Set up QEMU for PowerPC64LE
        if: matrix.build_mode == 'qemu'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le

      - name: Install Debian packaging tools
        if: matrix.build_mode != 'qemu'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl devscripts equivs git gzip

      - name: Install NVIDIA CUDA build toolkit
        if: matrix.variant == 'nvjpeg'
        run: veejay-current/packaging/ci/install-cuda-toolkit.sh

      - name: Build package suite natively
        if: matrix.build_mode != 'qemu'
        env:
          PACKAGE_BUILD_ENVIRONMENT: ${{ matrix.environment }}
          PACKAGE_VARIANT: ${{ matrix.variant }}
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          veejay-current/packaging/ci/deb-suite-builder.sh \
            '${{ matrix.arch_target }}'

      - name: Build package suite through QEMU
        if: matrix.build_mode == 'qemu'
        env:
          ARCH_TARGET: ${{ matrix.arch_target }}
          CONTAINER_PLATFORM: ${{ matrix.platform }}
          PACKAGE_BUILD_ENVIRONMENT: ${{ matrix.environment }}
          PACKAGE_VARIANT: ${{ matrix.variant }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$CONTAINER_PLATFORM" \
            --env ARCH_TARGET \
            --env PACKAGE_BUILD_ENVIRONMENT \
            --env PACKAGE_VARIANT \
            --env QEMU_CPU \
            --env RELEASE_TARGET \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/veejay-current \
            ubuntu:24.04 \
            bash -lc '
              set -euo pipefail
              test "$(uname -m)" = ppc64le
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential curl devscripts equivs git gzip
              packaging/ci/deb-suite-builder.sh "$ARCH_TARGET"
            '

      - name: Upload package suite
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.suite_target }}
          path: veejay-current/release-packages/${{ matrix.suite_target }}/deb/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  rpm:
    name: RPM / ${{ matrix.suite_target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.rpm_matrix) }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Use current release tooling
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git restore --source="$WORKFLOW_SHA" --worktree -- \
            veejay-current/packaging/ci \
            veejay-current/veejay-server/veejay.spec

      - name: Set up QEMU for PowerPC64LE
        if: matrix.build_mode == 'qemu'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le

      - name: Install NVIDIA CUDA build toolkit
        if: matrix.variant == 'nvjpeg'
        run: veejay-current/packaging/ci/install-cuda-toolkit.sh

      - name: Build package suite in Fedora
        env:
          ARCH_TARGET: ${{ matrix.arch_target }}
          CONTAINER_PLATFORM: ${{ matrix.platform || '' }}
          PACKAGE_BUILD_ENVIRONMENT: ${{ matrix.environment }}
          PACKAGE_VARIANT: ${{ matrix.variant }}
          QEMU_CPU: ${{ matrix.qemu_cpu || '' }}
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          set -euo pipefail
          cuda_args=()
          platform_args=()
          qemu_args=()
          if [[ -n "$CONTAINER_PLATFORM" ]]; then
            platform_args+=(--platform "$CONTAINER_PLATFORM")
            qemu_args+=(--env QEMU_CPU)
          fi
          if [[ "$PACKAGE_VARIANT" == nvjpeg ]]; then
            : "${CUDA_HOME:?CUDA_HOME was not exported by the toolkit installer}"
            : "${CUDA_LIBRARY_PATH:?CUDA_LIBRARY_PATH was not exported by the toolkit installer}"
            : "${NVCC:?NVCC was not exported by the toolkit installer}"
            cuda_args+=(
              --volume "${CUDA_HOME}:${CUDA_HOME}:ro"
              --env CUDA_HOME
              --env CUDA_PATH
              --env CUDA_LIBRARY_PATH
              --env CUDA_SERIES
              --env LD_LIBRARY_PATH
              --env NVCC
            )
          fi
          docker run --rm \
            "${platform_args[@]}" \
            --env ARCH_TARGET \
            --env PACKAGE_BUILD_ENVIRONMENT \
            --env PACKAGE_VARIANT \
            --env RELEASE_TARGET \
            "${qemu_args[@]}" \
            "${cuda_args[@]}" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/veejay-current \
            fedora:43 \
            bash -lc '
              set -euo pipefail
              if [[ -n "${QEMU_CPU:-}" ]]; then
                test "$(uname -m)" = ppc64le
              fi
              dnf install -y \
                alsa-lib-devel autoconf automake binutils cpio findutils fontconfig-devel \
                freetype-devel gcc gcc-c++ gdk-pixbuf2-devel git-core glib2-devel gtk3-devel \
                gzip jack-audio-connection-kit-devel libdv-devel \
                libjpeg-turbo-devel liblo-devel libtool libunwind-devel \
                libX11-devel libXinerama-devel libxml2-devel make \
                pkgconf-pkg-config rpm-build SDL2-devel shadow-utils tar which \
                ffmpeg-free-devel
              packaging/ci/rpm-suite-builder.sh "$ARCH_TARGET"
            '

      - name: Upload package suite
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-${{ matrix.suite_target }}
          path: veejay-current/release-packages/${{ matrix.suite_target }}/rpm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  arch:
    name: Arch / ${{ matrix.suite_target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.arch_matrix) }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Use current release tooling
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git restore --source="$WORKFLOW_SHA" --worktree -- veejay-current/packaging/ci

      - name: Install NVIDIA CUDA build toolkit
        if: matrix.variant == 'nvjpeg'
        run: veejay-current/packaging/ci/install-cuda-toolkit.sh

      - name: Build package suite in Arch Linux
        env:
          ARCH_TARGET: ${{ matrix.arch_target }}
          PACKAGE_BUILD_ENVIRONMENT: ${{ matrix.environment }}
          PACKAGE_VARIANT: ${{ matrix.variant }}
          RELEASE_TARGET: ${{ matrix.release_target }}
        run: |
          set -euo pipefail
          cuda_args=()
          if [[ "$PACKAGE_VARIANT" == nvjpeg ]]; then
            : "${CUDA_HOME:?CUDA_HOME was not exported by the toolkit installer}"
            : "${CUDA_LIBRARY_PATH:?CUDA_LIBRARY_PATH was not exported by the toolkit installer}"
            : "${NVCC:?NVCC was not exported by the toolkit installer}"
            cuda_args+=(
              --volume "${CUDA_HOME}:${CUDA_HOME}:ro"
              --env CUDA_HOME
              --env CUDA_PATH
              --env CUDA_LIBRARY_PATH
              --env CUDA_SERIES
              --env LD_LIBRARY_PATH
              --env NVCC
            )
          fi
          docker run --rm \
            --env ARCH_TARGET \
            --env PACKAGE_BUILD_ENVIRONMENT \
            --env PACKAGE_VARIANT \
            --env RELEASE_TARGET \
            "${cuda_args[@]}" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/veejay-current \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed git sudo
              packaging/ci/arch-suite-builder.sh "$ARCH_TARGET"
            '

      - name: Upload package suite
        uses: actions/upload-artifact@v4
        with:
          name: packages-arch-${{ matrix.suite_target }}
          path: veejay-current/release-packages/${{ matrix.suite_target }}/arch/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [prepare, deb, rpm, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Use current release tooling
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git restore --source="$WORKFLOW_SHA" --worktree -- veejay-current/packaging/ci

      - name: Install release archive tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq unzip zip

      - name: Download package suites
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: downloaded-packages
          merge-multiple: false

      - name: Stage release ZIP archives
        run: |
          veejay-current/packaging/ci/stage-release-assets.sh \
            downloaded-packages release-assets

      - name: Preserve combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: veejay-${{ needs.prepare.outputs.version }}-distro-packages
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes --title "VeeJay ${VERSION}" --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove legacy loose release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.id')"
          legacy_asset_rows="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | select(.name | test("^(deb|rpm|arch)-.+--")) | [.id, .name] | @tsv')"
          legacy_assets=()
          if [[ -n "$legacy_asset_rows" ]]; then
            mapfile -t legacy_assets <<< "$legacy_asset_rows"
          fi
          printf 'Removing %d legacy loose release assets\n' "${#legacy_assets[@]}"
          for legacy_asset in "${legacy_assets[@]}"; do
            IFS=$'\t' read -r asset_id asset_name <<< "$legacy_asset"
            printf 'Removing legacy asset %s\n' "$asset_name"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
